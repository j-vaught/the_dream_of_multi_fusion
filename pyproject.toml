[project]
name = "dream-fusion-labeler"
version = "0.1.0"
description = "Correction-first video annotation for the Dream Fusion dataset"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1,<4",
    "pillow>=11.0,<13",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "ty>=0.0.1a16",
]
experiments = [
    "torch>=2.6,<2.7",
    "transformers>=4.50,<5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
